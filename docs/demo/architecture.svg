<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">AeroMaint evidence-first architecture</title>
  <desc id="desc">Validated sources flow through canonical contracts and APIs into SDKs, the synchronized viewer, research ML, and bounded retrieval tools, with human review outside the prototype.</desc>
  <rect width="1200" height="500" fill="#0b1220"/>
  <style>.b{fill:#14233b;stroke:#5ea4ff;stroke-width:2}.t{fill:#eef6ff;font:18px system-ui,sans-serif}.s{fill:#a9bfd9;font:14px system-ui,sans-serif}.a{stroke:#77d6b1;stroke-width:3;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77d6b1"/></marker></defs>
  <text x="50" y="55" class="t" style="font-size:28px;font-weight:700">AeroMaint Studio</text>
  <text x="50" y="83" class="s">Evidence-first, local, educational decision-support prototype</text>
  <g><rect class="b" x="50" y="155" rx="12" width="190" height="100"/><text class="t" x="75" y="190">Validated sources</text><text class="s" x="75" y="220">fixtures · EuRoC · MCAP</text></g>
  <g><rect class="b" x="285" y="155" rx="12" width="205" height="100"/><text class="t" x="310" y="190">Canonical contract</text><text class="s" x="310" y="220">manifest · bigint ns clock</text></g>
  <g><rect class="b" x="535" y="155" rx="12" width="170" height="100"/><text class="t" x="575" y="190">FastAPI /v1</text><text class="s" x="568" y="220">auth · audit · ranges</text></g>
  <g><rect class="b" x="755" y="115" rx="12" width="190" height="100"/><text class="t" x="790" y="150">Public SDKs</text><text class="s" x="785" y="180">TypeScript · Python</text></g>
  <g><rect class="b" x="755" y="265" rx="12" width="190" height="100"/><text class="t" x="780" y="300">Research services</text><text class="s" x="782" y="330">RUL · retrieval · MCP</text></g>
  <g><rect class="b" x="990" y="115" rx="12" width="165" height="100"/><text class="t" x="1015" y="150">Viewer</text><text class="s" x="1015" y="180">sync · annotate · export</text></g>
  <g><rect class="b" x="990" y="265" rx="12" width="165" height="100"/><text class="t" x="1015" y="300">Human review</text><text class="s" x="1015" y="330">authority stays outside</text></g>
  <path class="a" d="M240 205H285"/><path class="a" d="M490 205H535"/><path class="a" d="M705 190L755 165"/><path class="a" d="M705 220L755 300"/><path class="a" d="M945 165H990"/><path class="a" d="M945 315H990"/>
  <text x="50" y="450" class="s">Every release claim points to retained evidence or is marked not_run.</text>
</svg>
