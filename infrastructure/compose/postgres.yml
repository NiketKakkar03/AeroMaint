# Standalone database profile for migration and repository integration tests.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aeromaint_test
      POSTGRES_USER: aeromaint
      POSTGRES_PASSWORD: aeromaint-local-only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeromaint -d aeromaint_test"]
      interval: 2s
      timeout: 5s
      retries: 15
