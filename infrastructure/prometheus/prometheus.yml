global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: aeromaint-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  - job_name: aeromaint-profile-services
    metrics_path: /metrics
    static_configs:
      - targets: [media-worker:9011, ml-service:9012, ai-service:9013]
