name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
      - uses: aquasecurity/setup-trivy@v0.2.4
        with:
          version: v0.65.0
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --python 3.11
      - run: uv tool install pip-audit
      - run: pnpm --filter @aeromaint/viewer exec playwright install --with-deps chromium firefox
      - run: make ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate
          path: |
            artifacts/release/
            apps/viewer/playwright-report/
          if-no-files-found: ignore
