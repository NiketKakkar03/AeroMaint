[project]
name = "aeromaint"
version = "0.1.0"
description = "Python services and pipelines for AeroMaint Studio"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116.1,<1",
  "pyarrow>=23.0.1,<24",
  "pydantic-settings>=2.10.1,<3",
  "psycopg[binary]>=3.2.9,<4",
  "structlog>=25.4.0,<26",
  "uvicorn[standard]>=0.35.0,<1",
  "pypdf>=5.9.0,<6",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=1.17.0,<2",
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.7,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps/data-api/src", "apps/worker/src", "packages", "pipelines"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["apps/data-api/src", "apps/worker/src", "."]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=aeromaint_api --cov-report=term-missing"
pythonpath = [".", "apps/data-api/src", "apps/worker/src"]
testpaths = [
  "apps/data-api/tests",
  "tests/contract",
  "tests/end_to_end",
  "tests/integration",
  "tests/load",
  "tests/ml",
  "tests/security",
]

[tool.coverage.run]
branch = true
