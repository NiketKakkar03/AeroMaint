name: aeromaint

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aeromaint}
      POSTGRES_USER: ${POSTGRES_USER:-aeromaint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeromaint-local-only}
    ports:
      - "5432:5432"
    volumes:
      - aeromaint-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/data-api/Dockerfile
    profiles: [core]
    environment:
      AEROMAINT_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aeromaint}:${POSTGRES_PASSWORD:-aeromaint-local-only}@postgres:5432/${POSTGRES_DB:-aeromaint}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  viewer:
    build:
      context: .
      dockerfile: apps/viewer/Dockerfile
    profiles: [core]
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  aeromaint-postgres:
